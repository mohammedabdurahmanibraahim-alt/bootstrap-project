<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <title>Bootstrap </title>
</head>

<body>
    <h1>Bootstrap Grid</h1>
    <div class="container ">
       <div class="row">
<!-- Automatically divides each column into equal parts -->

            <div class="col border">Column 1</div>
            <div class="col border">Column 2</div>
            <div class="col border">Column 3</div>
            <div class="col border">Column 4</div>
            <div class="col border">Column 5</div>
            <div class="col border">Column 6</div>
            <div class="col border">Column 7</div>
            <div class="col border">Column 8</div>
            <div class="col border">Column 9</div>
            <div class="col border">Column 10</div>
            <div class="col border">Column 11</div>
            <div class="col border">Column 12</div>
       </div>
       <div class="row">
        <!-- Row with only 3 columns -->
<!-- Each column automatically gets an equal width -->

        <div class="col border">Column 1</div>
        <div class="col border">Column 2</div>
        <div class="col border">Column 3</div>
       </div>

       <div class="row">
<!-- Manually specified column widths -->

        <div class="col-12 col-sm-6 col-md-5 border">Column 1</div>
        <div class="col border">Column 2</div>
        <div class="col border">Column 3</div>
        <div class="col-1 border">Column 4</div>
       </div>

       
    </div>
</body>

</html>
